name: snapmon
description: 写真で生まれ、歩いて育つ、育成バトルRPG
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ^3.10.0
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter
  crypto: ^3.0.5
  flutter_riverpod: ^2.6.1
  go_router: ^14.6.0
  firebase_core: ^4.15.0
  firebase_auth: ^6.7.0
  firebase_app_check: ^0.4.8
  cloud_functions: ^6.5.0
  google_sign_in: ^7.2.0
  sign_in_with_apple: ^8.2.0
  camera: ^0.12.1
  image: ^4.10.1
  google_mlkit_face_detection: ^0.15.1
  flutter_svg: ^2.3.0
  cloud_firestore: ^6.10.0
  health: ^13.3.2
  shared_preferences: ^2.5.5
  firebase_storage: ^13.6.0
  image_picker: ^1.2.3
  # P1 で追加: camera, image, exif, google_mlkit_face_detection
  # P2 で追加: pedometer, health, drift

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  # shared-config は tool/copy_config.sh で assets/config/ にコピーする（生成物、git 管理外）
  assets:
    - assets/config/
    - assets/legal/
    - assets/art/placeholder/
