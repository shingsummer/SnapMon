name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  fixtures:
    name: fixtures up to date (python reference)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python tools/gen_fixtures.py --check
      - run: python tools/sim_growth.py

  functions:
    name: functions (typescript)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: functions
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: functions/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build

  app:
    name: app (flutter)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: bash tool/copy_config.sh
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
